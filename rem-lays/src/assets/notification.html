<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notification</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap');

    :root {
      --bg-color: #121212;
      --bg-border: rgba(255, 255, 255, 0.08);
      --text-main: #ffffff;
      --text-muted: #a1a1aa;
      --accent: #10b981;
      --surface: rgba(255, 255, 255, 0.03);
      --surface-hover: rgba(255, 255, 255, 0.08);
    }
    
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      user-select: none;
    }

    .toast-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    .top-bar {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0.7;
    }

    .top-bar-left svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 16px 24px;
      text-align: center;
    }

    .icon-wrapper {
      position: relative;
      margin-bottom: 20px;
    }

    .big-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
    }

    .big-icon svg {
      width: 32px;
      height: 32px;
      fill: currentColor;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .badge {
      position: absolute;
      bottom: -4px;
      right: -4px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      justify-content: center;
      align-items: center;
      border: 3px solid var(--bg-color);
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.4);
    }

    .badge svg {
      width: 12px;
      height: 12px;
      fill: #fff;
    }

    .title {
      color: var(--text-main);
      font-weight: 600;
      font-size: 18px;
      margin-bottom: 4px;
      word-break: break-all;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.3;
      letter-spacing: -0.3px;
    }

    .body {
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.4;
    }

    .footer {
      width: 100%;
      padding: 0 20px 20px 20px;
      box-sizing: border-box;
    }

    .close-btn {
      width: 100%;
      padding: 12px;
      background-color: var(--surface);
      color: var(--text-main);
      border: 1px solid var(--bg-border);
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .close-btn:hover {
      background-color: var(--surface-hover);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .close-btn:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>
  <div class="toast-container">
    <div class="top-bar" data-tauri-drag-region>
      <div class="top-bar-left" data-tauri-drag-region>
        <svg viewBox="0 0 24 24"><path d="M12 2L2 22h20L12 2z"/></svg>
        Rem-Lays
      </div>
    </div>
    <div class="content" data-tauri-drag-region>
      <div class="icon-wrapper">
        <div class="big-icon" id="big-icon">
          <!-- Icon will be injected here -->
        </div>
        <div class="badge">
          <svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg>
        </div>
      </div>
      <div class="title" id="toast-title">New Item</div>
      <div class="body" id="toast-body">You have received a new item.</div>
    </div>
    <div class="footer">
      <button class="close-btn" id="close-btn">Close</button>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const title = params.get('title');
    const body = params.get('body');
    const type = params.get('type') || 'file';

    if (title) document.getElementById('toast-title').innerText = title;
    if (body) document.getElementById('toast-body').innerText = body;

    let iconSvg = '';
    if (type === 'image') {
      iconSvg = '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/><path d="m21 15-5-5L5 21" stroke="currentColor" stroke-width="2"/></svg>';
    } else if (type === 'video' || type === 'reel') {
      iconSvg = '<svg viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3" fill="currentColor"/></svg>';
    } else if (type === 'link') {
      iconSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>';
    } else if (type === 'text') {
      iconSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>';
    } else {
      iconSvg = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2h12c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>';
    }
    document.getElementById('big-icon').innerHTML = iconSvg;

    function closeWindow() {
      if (window.__TAURI_INTERNALS__) {
        window.__TAURI_INTERNALS__.invoke('plugin:window|close').catch(err => {
          console.error(err);
          window.close();
        });
      } else if (window.__TAURI__ && window.__TAURI__.window) {
        window.__TAURI__.window.getCurrentWindow().close().catch(err => {
          console.error(err);
          window.close();
        });
      } else {
        window.close();
      }
    }

    document.getElementById('close-btn').addEventListener('click', closeWindow);
  </script>
</body>
</html>
