<div class="swipe-container"
     (touchstart)="onTouchStart($event)"
     (touchmove)="onTouchMove($event)"
     (touchend)="onTouchEnd($event)">
  <div class="swipe-actions left" *ngIf="swipeTranslation > 0" [class.active]="swipeTranslation > swipeThreshold" [style.opacity]="swipeTranslation / swipeThreshold">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="21 8 21 21 3 21 3 8"></polyline><rect x="1" y="3" width="22" height="5"></rect><line x1="10" y1="12" x2="14" y2="12"></line>
    </svg>
  </div>
  <div class="swipe-actions right" *ngIf="swipeTranslation < 0" [class.active]="swipeTranslation < -swipeThreshold" [style.opacity]="-swipeTranslation / swipeThreshold">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 17v5" />
      <path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z" />
    </svg>
  </div>
  
  <div class="card" 
       [class.unseen]="item.status === 'unseen'" 
       [class.incoming]="isNew" 
       [class.selected]="itemsSvc.selectedItemIds().has(item.id)"
       [class.selection-active]="itemsSvc.selectionMode()"
       (click)="itemsSvc.selectionMode() ? toggleSelection($event) : onOpen()" 
       (contextmenu)="onContextMenu($event); false" 
       [style.z-index]="showExpireMenu ? 100 : 1"
       [style.transform]="swipeTransform"
       [style.transition]="swipeTransition">
  
  <div class="selection-overlay" *ngIf="itemsSvc.selectionMode()">
    <div class="checkbox" [class.checked]="itemsSvc.selectedItemIds().has(item.id)">
      <svg *ngIf="itemsSvc.selectedItemIds().has(item.id)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
    </div>
  </div>
  <div class="pin-indicator" *ngIf="item.is_pinned && item.status !== 'deleted'">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 17v5" />
      <path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z" />
    </svg>
  </div>
  <div class="card-actions" *ngIf="item.status !== 'deleted'" (click)="$event.stopPropagation()">
    <button class="action-icon-btn" [class.pinned]="item.is_pinned" (click)="togglePin($event)" [title]="item.is_pinned ? 'Unpin' : 'Pin to top'">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 17v5" />
        <path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z" />
      </svg>
    </button>
  </div>

  <ng-container [ngSwitch]="item.type">
    <p *ngSwitchCase="'text'" class="body text">{{ noteText }}</p>

    <div *ngSwitchCase="'link'" class="body link">
      <img *ngIf="linkImage" [src]="linkImage" class="link-image" alt="" />
      <a href="#" class="link-title" (click)="openLink($event)">{{ linkTitle }}</a>
      <span class="link-url-text" *ngIf="linkUrl && linkUrl !== linkTitle">{{ linkUrl }}</span>
    </div>

    <div *ngSwitchCase="'image'" class="body media">
      <img *ngIf="mediaUrl" [src]="mediaUrl" [alt]="mediaFilename" />
      <div *ngIf="!mediaUrl" class="media-loading">Loading image…</div>
    </div>

    <div *ngSwitchCase="'video'" class="body media">
      <video *ngIf="mediaUrl" [src]="mediaUrl" controls (click)="$event.stopPropagation()"></video>
      <div *ngIf="!mediaUrl" class="media-loading">Loading video…</div>
    </div>

    <div *ngSwitchCase="'reel'" class="body reel">
      <div *ngIf="reelEmbedHtml; else reelLoading" class="reel-embed" [innerHTML]="reelEmbedHtml"></div>
      <ng-template #reelLoading>
        <div class="media-loading">Loading reel from {{ reelAuthorName }}…</div>
      </ng-template>
    </div>

    <div *ngSwitchDefault class="body media-placeholder">
      <span class="type-label">{{ item.type }}</span>
      <span class="note">Unsupported item type</span>
    </div>
  </ng-container>

  <div class="tags-container" *ngIf="itemTags.length > 0 && !editingTags" (click)="$event.stopPropagation()">
    <span class="card-tag" *ngFor="let t of itemTags" (click)="itemsSvc.selectedTag() === t ? itemsSvc.selectedTag.set(null) : itemsSvc.selectedTag.set(t)">#{{t}}</span>
    <button class="edit-tags-btn" (click)="startEditTags($event)" title="Edit tags">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
    </button>
  </div>
  <div class="tags-container empty" *ngIf="itemTags.length === 0 && !editingTags" (click)="$event.stopPropagation()">
    <button class="add-tags-btn" (click)="startEditTags($event)">+ Add tags</button>
  </div>
  <div class="tags-edit-container" *ngIf="editingTags" (click)="$event.stopPropagation()">
    <input class="tags-edit-input" [(ngModel)]="editTagsValue" (keydown.enter)="saveTags($event)" (keydown.escape)="cancelEditTags($event)" placeholder="Tags (comma separated)" autoFocus />
    <button class="tags-action-btn save" (click)="saveTags($event)">Save</button>
    <button class="tags-action-btn" (click)="cancelEditTags($event)">Cancel</button>
  </div>

  <div class="meta">
    <span class="time">{{ item.created_at | date:'MMM d, h:mm a' }}</span>
    <div class="meta-row" *ngIf="item.status === 'unseen' || item.expires_at || item.share_token">
      <span class="new-badge" *ngIf="item.status === 'unseen'" (click)="markAsRead($event)" style="cursor: pointer;" title="Mark as read">NEW</span>
      <span class="expire-badge" *ngIf="item.expires_at" title="Expiring soon">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:2px; vertical-align:middle"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        {{ expireText }}
      </span>
      <span class="share-badge" *ngIf="item.share_token" title="Shared publicly">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:2px; vertical-align:middle">
          <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
          <polyline points="16 6 12 2 8 6"></polyline>
          <line x1="12" y1="2" x2="12" y2="15"></line>
        </svg>
        Shared
      </span>
    </div>
  </div>
</div>
</div>
