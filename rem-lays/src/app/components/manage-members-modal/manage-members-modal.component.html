<div class="overlay" (click)="close.emit()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Manage Members</h3>
      <button class="close-btn" (click)="close.emit()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <div *ngIf="isLoading()" class="loading">Loading members...</div>
      
      <div *ngIf="!isLoading()" class="members-list">
        <div *ngFor="let member of members()" class="member-row">
          <div class="member-info">
            <div class="member-email">{{ member.email }} <span *ngIf="member.user_id === currentUserId" class="you-badge">(You)</span></div>
            <div class="member-role-label" *ngIf="!isOwner() || member.role === 'owner'">{{ member.role | titlecase }}</div>
          </div>
          
          <div class="member-actions" *ngIf="isOwner() && member.role !== 'owner'">
            <select class="role-select" [ngModel]="member.role" (ngModelChange)="changeRole(member, $event)">
              <option value="editor">Editor</option>
              <option value="viewer">Viewer</option>
            </select>
            <button class="icon-btn remove-btn" title="Remove member" (click)="removeMember(member)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
