<aside class="sidebar" [class.open]="open">
  <div class="brand" data-tauri-drag-region>
    <div class="brand-mark" data-tauri-drag-region>R</div>
    <div class="brand-name" data-tauri-drag-region>Rem-Lays</div>
    <div class="brand-spacer" data-tauri-drag-region></div>
    <button class="icon-btn" title="Settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>

  <div class="search-wrap">
    <input type="search" class="search-input" placeholder="Search items" [ngModel]="itemsSvc.searchQuery()" (ngModelChange)="itemsSvc.searchQuery.set($event)" (keyup.enter)="navigated.emit()" />
    <svg *ngIf="!itemsSvc.searchQuery()" class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <button *ngIf="itemsSvc.searchQuery()" class="clear-search-btn" (click)="itemsSvc.searchQuery.set('')" title="Clear search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <div class="nav-section-label">Inbox</div>
  <nav class="filters">
    <button class="filter-item" [class.active]="itemsSvc.filter() === 'all'" (click)="setFilter('all')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
      <span class="label">All Items</span>
    </button>
    <button class="filter-item" [class.active]="itemsSvc.filter() === 'unseen'" (click)="setFilter('unseen')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <span class="label">While You Were Away</span>
      <span class="badge" *ngIf="itemsSvc.unseenCount() > 0">{{ itemsSvc.unseenCount() }}</span>
    </button>
    <button class="filter-item" [class.active]="itemsSvc.filter() === 'link'" (click)="setFilter('link')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      <span class="label">Links</span>
    </button>
    <button class="filter-item" [class.active]="itemsSvc.filter() === 'media'" (click)="setFilter('media')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
      <span class="label">Media</span>
    </button>
  </nav>

  <div class="tags-section" *ngIf="itemsSvc.allTags().length > 0">
    <div class="nav-section-label">Tags</div>
    <div class="tags-list">
      <button class="tag-pill" 
              *ngFor="let tag of itemsSvc.allTags()" 
              [class.active]="itemsSvc.selectedTag() === tag"
              (click)="itemsSvc.selectedTag() === tag ? itemsSvc.selectedTag.set(null) : itemsSvc.selectedTag.set(tag); navigated.emit()">
        #{{ tag }}
      </button>
    </div>
  </div>

  <div class="divider"></div>

  <div class="devices-section">
    <div class="nav-section-label">Your devices</div>
    <div class="device-row" *ngFor="let d of devicesSvc.devices()" [class.is-offline]="!presenceSvc.onlineDeviceIds().has(d.id)">
      <div class="device-dot" [class.online]="presenceSvc.onlineDeviceIds().has(d.id)" [class.pulse]="presenceSvc.onlineDeviceIds().has(d.id)" [class.offline]="!presenceSvc.onlineDeviceIds().has(d.id)"></div>
      <div class="device-info">
        <ng-container *ngIf="editingDeviceId !== d.id; else editMode">
          <div class="device-name-container">
            <div class="device-name">{{ d.device_name }}</div>
            <button class="edit-btn" title="Rename device" (click)="startEditDevice(d)">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
            </button>
          </div>
        </ng-container>
        <ng-template #editMode>
          <input class="device-edit-input" 
                 [value]="editDeviceName" 
                 (input)="editDeviceName = $any($event).target.value"
                 (keyup.enter)="saveEditDevice(d)" 
                 (keyup.escape)="cancelEditDevice()" 
                 (blur)="saveEditDevice(d)" 
                 autoFocus />
        </ng-template>
        <div class="device-status">{{ presenceSvc.onlineDeviceIds().has(d.id) ? 'Online' : 'Offline' }}</div>
      </div>
    </div>
  </div>

  <div class="sidebar-footer">
    <span class="email">{{ auth.session()?.user?.email }}</span>
    <button class="signout-btn" (click)="auth.signOut()">Sign out</button>
  </div>
</aside>
