<div class="modal-overlay" *ngIf="open" (click)="close.emit()">
  <div class="modal-content digest-modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div class="headline-container">
        <h2>Weekly Digest</h2>
        <p class="headline-text">{{ stats().headline }}</p>
      </div>
      <button class="close-btn" (click)="close.emit()" title="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="modal-body">
      <div class="stats-row">
        <div class="stat-pill total">
          <span class="count">{{ stats().total }}</span>
          <span class="label">Total Items</span>
        </div>
        <div class="stat-pill" *ngIf="stats().notes > 0">
          <span class="count">{{ stats().notes }}</span>
          <span class="label">Notes</span>
        </div>
        <div class="stat-pill" *ngIf="stats().links > 0">
          <span class="count">{{ stats().links }}</span>
          <span class="label">Links</span>
        </div>
        <div class="stat-pill" *ngIf="stats().images > 0">
          <span class="count">{{ stats().images }}</span>
          <span class="label">Images</span>
        </div>
        <div class="stat-pill" *ngIf="stats().videos > 0">
          <span class="count">{{ stats().videos }}</span>
          <span class="label">Video</span>
        </div>
      </div>

      <div class="digest-feed">
        <p class="empty-state" *ngIf="recentItems().length === 0">No items saved in the last 7 days.</p>
        <app-item-card *ngFor="let item of recentItems()" [item]="item"></app-item-card>
      </div>
    </div>
  </div>
</div>
