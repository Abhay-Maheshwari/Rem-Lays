  <title>Download Feature Graphic</title>

  <style>
    body {
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
    }
    #banner {
      width: 1024px;
      height: 500px;
      background-color: #030304;
      background-image: 
        radial-gradient(circle 800px at 50% -120px, rgba(148, 163, 184, 0.14), transparent 70%),
        radial-gradient(circle 500px at 50% 20%, rgba(255, 255, 255, 0.04), transparent 60%),
        radial-gradient(rgba(255, 255, 255, 0.05) 1.5px, transparent 1.5px);
      background-size: 100% 100%, 100% 100%, 24px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #ffffff;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }
    .content {
      display: flex;
      align-items: center;
      gap: 40px;
      z-index: 10;
    }
    img.logo {
      width: 160px;
      height: 160px;
      border-radius: 36px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.1);
    }
    .text-container {
      display: flex;
      flex-direction: column;
    }
    h1 {
      font-size: 84px;
      margin: 0;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    p {
      font-size: 26px;
      margin: 12px 0 0 0;
      color: #a1a1aa;
      font-weight: 500;
    }
    button {
      margin-top: 40px;
      padding: 16px 32px;
      font-size: 20px;
      font-weight: bold;
      background: #e8622f;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(232, 98, 47, 0.3);
    }
    button:hover {
      background: #ff7a45;
    }
  </style>
