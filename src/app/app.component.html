<!-- Public shared item view — no auth, no sidebar, just the card -->
<app-shared-item-viewer *ngIf="sharedToken()" [token]="sharedToken()!"></app-shared-item-viewer>

<!-- Normal app (only rendered when NOT viewing a shared item) -->
<ng-container *ngIf="!sharedToken()">
<div data-tauri-drag-region class="titlebar" *ngIf="isDesktop">
  <div class="window-controls">
    <button class="win-btn" (click)="minimize()" title="Minimize">
      <svg width="11" height="11" viewBox="0 0 11 11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M11 5.5H0" stroke="currentColor" stroke-width="1"/></svg>
    </button>
    <button class="win-btn" (click)="maximize()" title="Maximize">
      <svg width="11" height="11" viewBox="0 0 11 11" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0.5" y="0.5" width="10" height="10" stroke="currentColor" stroke-width="1"/></svg>
    </button>
    <button class="win-btn close" (click)="close()" title="Close">
      <svg width="11" height="11" viewBox="0 0 11 11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 1L10 10M1 10L10 1" stroke="currentColor" stroke-width="1"/></svg>
    </button>
  </div>
</div>

<main class="shell" *ngIf="auth.isInitializing()">
  <div class="card splash">
    <img [src]="isDesktop ? 'assets/logo_dark_mode.png' : 'assets/logo_light_mode.png'" class="splash-logo" alt="RemLays" style="width: 64px; height: 64px; margin-bottom: 16px; opacity: 0.8; animation: pulse 2s infinite;" />
  </div>
</main>

<main class="shell" *ngIf="!auth.isInitializing() && !auth.session()">
  <div class="card">
    <h1>Rem-Lays</h1>
    <p class="muted">Sign in to see your inbox.</p>
    <button class="primary" (click)="signIn()">Sign in with Google</button>
  </div>
</main>

<div class="app" *ngIf="auth.session()">
  <button class="mobile-menu-btn" (click)="toggleSidebar()" aria-label="Open menu">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>
  <div class="backdrop" [class.visible]="sidebarOpen()" (click)="closeSidebar()"></div>
  <app-sidebar [open]="sidebarOpen()" [activeView]="activeView()" (navigated)="activeView.set('feed'); closeSidebar()" (openHome)="activeView.set('home'); closeSidebar()" (openDigest)="showWeeklyDigest.set(true); closeSidebar()" (openSettingsPage)="activeView.set('settings'); closeSidebar()"></app-sidebar>
  <main class="main-pane">
    <ng-container *ngIf="activeView() === 'home'">
      <app-home (navigate)="$event === 'digest' ? showWeeklyDigest.set(true) : activeView.set($event)"></app-home>
    </ng-container>
    <ng-container *ngIf="activeView() === 'feed'">
      <app-feed></app-feed>
      <app-quick-action-bar></app-quick-action-bar>
    </ng-container>
    <ng-container *ngIf="activeView() === 'settings'">
      <app-settings-page (closeSettings)="activeView.set('feed')"></app-settings-page>
    </ng-container>
    <ng-container *ngIf="activeView() === 'calendar'">
      <app-calendar (navigate)="$event === 'digest' ? showWeeklyDigest.set(true) : activeView.set($event)"></app-calendar>
    </ng-container>
  </main>
</div>

<app-item-viewer></app-item-viewer>
<app-device-nickname-modal></app-device-nickname-modal>
<app-weekly-digest [open]="showWeeklyDigest()" (close)="showWeeklyDigest.set(false)"></app-weekly-digest>

<!-- Shortcuts Modal -->
<div class="modal-overlay" *ngIf="showShortcuts()" (click)="showShortcuts.set(false)">
  <div class="modal-content shortcuts-modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Keyboard Shortcuts</h2>
      <button class="close-btn" (click)="showShortcuts.set(false)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="shortcut-row">
        <span>Search</span>
        <div class="keys">
          <kbd>Ctrl/Cmd</kbd> + <kbd>K</kbd> <span>or</span> <kbd>/</kbd>
        </div>
      </div>
      <div class="shortcut-row">
        <span>New Note / Link</span>
        <div class="keys">
          <kbd>Ctrl/Cmd</kbd> + <kbd>N</kbd> <span>or</span> <kbd>C</kbd>
        </div>
      </div>
      <div class="shortcut-row">
        <span>Show Shortcuts</span>
        <div class="keys">
          <kbd>?</kbd>
        </div>
      </div>
      <div class="shortcut-row">
        <span>Close Modal / Blur</span>
        <div class="keys">
          <kbd>Esc</kbd>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Global Toast Notification -->
<div class="toast-notification" [class.show]="toastSvc.toast().show">
  <svg *ngIf="toastSvc.toast().type === 'success'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
    <polyline points="22 4 12 14.01 9 11.01"></polyline>
  </svg>
  <svg *ngIf="toastSvc.toast().type === 'error'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="error-icon">
    <circle cx="12" cy="12" r="10"></circle>
    <line x1="15" y1="9" x2="9" y2="15"></line>
    <line x1="9" y1="9" x2="15" y2="15"></line>
  </svg>
  {{ toastSvc.toast().message }}
</div>

<!-- Pending Share Modal -->
<div class="modal-overlay" *ngIf="shareIntentSvc.pendingShare()" (click)="cancelPendingShare()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Incoming Share</h2>
    </div>
    <div class="modal-body" style="display: flex; flex-direction: column; gap: 12px;">
      <div style="background: rgba(255,255,255,0.03); padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);">
        <p style="color: var(--text-secondary); word-break: break-all; margin: 0; font-size: 13px; max-height: 100px; overflow-y: auto;">
          {{ shareIntentSvc.pendingShare()?.payload }}
        </p>
      </div>
      
      <textarea #shareNote class="action-input" placeholder="Add a note (optional)..." style="width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-subtle); border-radius: 8px; color: var(--text-primary); font-family: inherit; font-size: 14px; resize: none; min-height: 80px;" [value]="pendingShareNote()" (input)="pendingShareNote.set(shareNote.value)" (keydown.enter)="$event.preventDefault(); confirmPendingShare()"></textarea>
      
      <div class="tags-input-wrap">
        <app-tag-input [tags]="pendingShareTags()" (tagsChange)="pendingShareTags.set($event)" placeholder="Add tags..."></app-tag-input>
      </div>
      
      <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px;">
        <button class="demo-btn" (click)="cancelPendingShare()">Discard</button>
        <button class="primary" (click)="confirmPendingShare()">Save</button>
      </div>
    </div>
  </div>
</div>

<app-context-menu></app-context-menu>
</ng-container>
