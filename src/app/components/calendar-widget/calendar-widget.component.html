<div class="calendar-widget">
  <div class="calendar-pane" (click)="openFullCalendar()" style="cursor: pointer;">
    <div class="calendar-header">
      <button class="icon-btn" (click)="prevMonth(); $event.stopPropagation()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <div class="month-year">{{ currentMonthDate | date:'MMMM yyyy' }}</div>
      <button class="icon-btn" (click)="nextMonth(); $event.stopPropagation()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
    </div>

    <div class="calendar-grid">
      <div class="weekday" *ngFor="let wd of weekDays">{{ wd }}</div>
      <div class="day" 
           *ngFor="let day of daysInMonth" 
           [class.other-month]="!day.isCurrentMonth"
           [class.today]="isToday(day.fullDate)"
           [class.selected]="selectedDate && isSameDay(selectedDate, day.fullDate)"
           [class.has-items]="day.items.length > 0"
           (click)="selectDate(day.fullDate); $event.stopPropagation()">
        <span class="date-num">{{ day.date }}</span>
        <div class="indicators" *ngIf="day.items.length > 0">
          <div class="dot" *ngFor="let item of day.items.slice(0, 3)"></div>
          <div class="dot-more" *ngIf="day.items.length > 3">+</div>
        </div>
      </div>
    </div>
  </div>
  
  <div class="scheduler-pane">
    <div class="scheduler-header">
      <h3>{{ selectedDate ? (selectedDate | date:'MMM d, yyyy') : 'Upcoming' }}</h3>
      <span class="count-badge" *ngIf="displayedItems.length > 0">{{ displayedItems.length }} tasks</span>
    </div>
    
    <div class="items-list">
      <div class="empty-state" *ngIf="displayedItems.length === 0">
        No scheduled items for this period.
      </div>
      
      <div class="schedule-item" *ngFor="let item of displayedItems" (click)="openItem(item)" style="cursor: pointer;">
        <div class="item-meta">
          <svg *ngIf="item.payload?.['deadline']" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent-primary)" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
          <span class="time">{{ getItemTargetTime(item) | date:'MMM d, h:mm a' }}</span>
        </div>
        <div class="item-title">{{ getItemTitle(item) }}</div>
      </div>
    </div>
  </div>
</div>
