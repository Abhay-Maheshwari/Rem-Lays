<div class="overlay" *ngIf="devicesSvc.needsNickname()">
  <div class="modal">
    <div class="modal-header">
      <h3>New Device Registered</h3>
    </div>
    <div class="modal-body">
      <p>What should we call this device?</p>
      <input 
        class="nickname-input" 
        [value]="deviceName" 
        (input)="deviceName = $any($event).target.value"
        (keyup.enter)="save()"
        autofocus
      />
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" (click)="skip()">Skip</button>
      <button class="btn-primary" (click)="save()">Save Nickname</button>
    </div>
  </div>
</div>
