<div class="backdrop" *ngIf="viewerSvc.currentItem() as item" (click)="close()">
  <div class="modal" (click)="$event.stopPropagation()" (contextmenu)="onContextMenu($event)">
    
    <div class="modal-actions">
      <ng-container *ngIf="item.type === 'text' || item.type === 'link' || item.type === 'reel'">
        <button class="action-btn" *ngIf="!isEditing()" (click)="startEdit()">Edit</button>
        <button class="action-btn primary" *ngIf="isEditing()" (click)="saveEdit()">Save</button>
        <button class="action-btn" *ngIf="isEditing()" (click)="cancelEdit()">Cancel</button>
      </ng-container>
    </div>

    <button class="close-btn" (click)="close()" title="Close">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>

    <!-- Image -->
    <ng-container *ngIf="item.type === 'image'">
      <img *ngIf="mediaUrl()" [src]="mediaUrl()" class="media-content">
      <div *ngIf="!mediaUrl()" class="loading">Loading...</div>
    </ng-container>

    <!-- Video -->
    <ng-container *ngIf="item.type === 'video'">
      <video *ngIf="mediaUrl()" [src]="mediaUrl()" controls autoplay class="media-content"></video>
      <div *ngIf="!mediaUrl()" class="loading">Loading...</div>
    </ng-container>

    <!-- Text -->
    <ng-container *ngIf="item.type === 'text'">
      <div class="text-content">
        <div class="text-meta">
          <span>{{ sourceDeviceName }}</span> • <span>{{ item.created_at | date:'MMM d, h:mm a' }}</span>
        </div>
        <p class="text-body" *ngIf="!isEditing()">{{ noteText }}</p>
        <textarea class="edit-textarea" *ngIf="isEditing()" [ngModel]="editNoteText()" (ngModelChange)="editNoteText.set($event)"></textarea>
      </div>
    </ng-container>

    <!-- Link -->
    <ng-container *ngIf="item.type === 'link'">
      <div class="link-content">
        <div class="link-favicon">{{ (linkDomain || linkUrl).charAt(0).toUpperCase() }}</div>
        
        <div class="link-title" *ngIf="!isEditing()">{{ linkTitle }}</div>
        <ng-container *ngIf="isEditing()">
          <input class="edit-input" type="text" [ngModel]="editLinkTitle()" (ngModelChange)="editLinkTitle.set($event)" placeholder="Title" />
          <input class="edit-input" type="text" [ngModel]="editLinkUrl()" (ngModelChange)="editLinkUrl.set($event)" placeholder="URL" style="margin-top: 8px;" />
        </ng-container>

        <a href="#" class="open-link-btn" (click)="openLink($event)">Open in Browser</a>
        <div class="link-url-display">{{ linkUrl }}</div>
      </div>
    </ng-container>

    <!-- Reel -->
    <ng-container *ngIf="item.type === 'reel'">
      <div style="padding-top: 60px; width: 100%; display: flex; flex-direction: column; align-items: center;">
        <div class="link-content" *ngIf="isEditing() || item.payload?.['title']" style="padding: 0 24px 20px 24px; width: 100%; max-width: 400px;">
          <div class="link-title" *ngIf="!isEditing() && item.payload?.['title']">{{ linkTitle }}</div>
          <ng-container *ngIf="isEditing()">
            <input class="edit-input" type="text" [ngModel]="editLinkTitle()" (ngModelChange)="editLinkTitle.set($event)" placeholder="Title" />
            <input class="edit-input" type="text" [ngModel]="editLinkUrl()" (ngModelChange)="editLinkUrl.set($event)" placeholder="URL" style="margin-top: 8px;" />
          </ng-container>
        </div>
        <div class="reel-content" style="display: flex; justify-content: center; width: 100%; overflow-y: auto; padding-bottom: 20px;">
          <div *ngIf="reelEmbedHtml(); else reelLoading" class="reel-embed" [innerHTML]="reelEmbedHtml()"></div>
          <ng-template #reelLoading>
            <div class="loading">Loading reel from {{ reelAuthorName }}…</div>
          </ng-template>
        </div>
      </div>
    </ng-container>

    <div class="modal-footer" *ngIf="itemTags.length > 0 || item.status === 'unseen' || item.expires_at">
      <div class="tags-container" *ngIf="itemTags.length > 0">
        <span class="card-tag" *ngFor="let t of itemTags">#{{t}}</span>
      </div>
      <div class="meta" *ngIf="item.status === 'unseen' || item.expires_at">
        <span class="new-badge" *ngIf="item.status === 'unseen'">NEW</span>
        <span class="expire-badge" *ngIf="item.expires_at">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:2px; vertical-align:middle"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          {{ expireText }}
        </span>
      </div>
    </div>

  </div>
</div>
