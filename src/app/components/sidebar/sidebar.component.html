<aside class="sidebar" [class.open]="open" (click)="closeShareDropdown()">
  <div class="brand" data-tauri-drag-region>
    <img [src]="themeSvc.isDark() ? 'assets/logo_dark_mode.png' : 'assets/logo_light_mode.png'" class="brand-logo" data-tauri-drag-region alt="RemLays" />
    <div class="brand-spacer" data-tauri-drag-region></div>
    <div class="brand-spacer" data-tauri-drag-region></div>
    <button class="icon-btn settings-btn" title="Settings" (click)="openSettings()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>

  <!-- Search wrap moved to feed component -->

  <div class="sidebar-scroll-area">
    <nav class="filters" style="margin-bottom: 12px; margin-top: 4px;">
      <button class="filter-item" [class.active]="activeView === 'home'" (click)="openHome.emit()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <span class="label">Dashboard</span>
      </button>
      <button class="filter-item" [class.active]="activeView === 'feed' && itemsSvc.filter() === 'all' && !itemsSvc.activeBoardId()" (click)="setFilter('all')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
        <span class="label">Inbox</span>
      </button>
      <button class="filter-item" [class.active]="activeView === 'feed' && itemsSvc.filter() === 'all' && itemsSvc.activeBoardId() === '*'" (click)="setAllItemsFilter()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
        <span class="label">All Items</span>
      </button>
    </nav>

    <div class="divider"></div>

    <div class="nav-section-header">
      <div class="nav-section-label">Status</div>
    </div>
    <nav class="filters nav-section-content">
      <button class="filter-item" [class.active]="activeView === 'feed' && itemsSvc.filter() === 'unseen'" (click)="setFilter('unseen')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <span class="label">Unread</span>
        <span class="badge" *ngIf="itemsSvc.unseenCount() > 0">{{ itemsSvc.unseenCount() }}</span>
      </button>
      <button class="filter-item" [class.active]="activeView === 'feed' && itemsSvc.filter() === 'pending'" (click)="setFilter('pending')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line><path d="M12 14v2l2 2"></path></svg>
        <span class="label">Pending</span>
        <span class="badge" *ngIf="itemsSvc.pendingCount() > 0">{{ itemsSvc.pendingCount() }}</span>
      </button>
      <button class="filter-item" [class.active]="activeView === 'feed' && itemsSvc.filter() === 'snoozed'" (click)="setFilter('snoozed')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        <span class="label">Snoozed</span>
      </button>
      <button class="filter-item" [class.active]="activeView === 'feed' && itemsSvc.filter() === 'untagged'" (click)="setFilter('untagged')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line><line x1="2" y1="2" x2="22" y2="22"></line></svg>
        <span class="label">Untagged</span>
      </button>
    </nav>

    <div class="divider"></div>

    <div class="nav-section-header">
      <div class="nav-section-label">Content</div>
    </div>
    <nav class="filters nav-section-content">
      <button class="filter-item" [class.active]="activeView === 'feed' && itemsSvc.filter() === 'link'" (click)="setFilter('link')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <span class="label">Links</span>
      </button>
      <button class="filter-item" [class.active]="activeView === 'feed' && itemsSvc.filter() === 'shared'" (click)="setFilter('shared')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
        <span class="label">Shared Links</span>
      </button>
      <button class="filter-item" [class.active]="activeView === 'feed' && itemsSvc.filter() === 'media'" (click)="setFilter('media')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
        <span class="label">Media</span>
      </button>
    </nav>

  <div class="divider"></div>

  <div class="boards-section">
    <div class="nav-section-header clickable" (click)="boardsCollapsed.set(!boardsCollapsed())">
      <div class="nav-section-label">Boards</div>
      <div class="header-actions">
        <button class="icon-btn" *ngIf="!boardsCollapsed()" (click)="openCreateBoard(); $event.stopPropagation()" title="Create Board">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
        <svg class="chevron" [class.rotated]="boardsCollapsed()" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </div>
    </div>
    <nav class="filters boards-list nav-section-content" *ngIf="boardsSvc.boards().length > 0 && !boardsCollapsed()" cdkDropList (cdkDropListDropped)="dropBoard($event)">
      <div class="board-item-wrap" *ngFor="let board of boardsSvc.boards()" cdkDrag [cdkDragStartDelay]="{mouse: 0, touch: 250}">
        <div style="width: 100%; display: flex;" cdkDropList [id]="'board-drop-' + board.id" (cdkDropListDropped)="dropItemOnBoard($event, board.id)">
          <button class="filter-item" [class.active]="activeView === 'feed' && itemsSvc.activeBoardId() === board.id" (click)="setBoard(board.id)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
            <span class="label">{{ board.name }}</span>
            <span class="badge" *ngIf="itemsSvc.getBoardUnseenCount(board.id) > 0">{{ itemsSvc.getBoardUnseenCount(board.id) }}</span>
          </button>
          <div class="board-actions">
            <button class="icon-btn" title="Board Settings" (click)="openManageMembers(board.id); $event.stopPropagation()">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            </button>
            <button class="icon-btn share-btn" title="Copy Invite Link" (click)="toggleShareDropdown(board, $event)">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
            </button>
          </div>
        </div>
      </div>
    </nav>
  </div>

  <!-- Tags section moved to feed component -->

  <div class="divider"></div>

  <div class="devices-section">
    <div class="nav-section-header clickable" (click)="devicesCollapsed.set(!devicesCollapsed())">
      <div class="nav-section-label">Your devices</div>
      <svg class="chevron" [class.rotated]="devicesCollapsed()" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </div>
    <div class="devices-list nav-section-content" *ngIf="!devicesCollapsed()">
      <div class="device-row" *ngFor="let d of devicesSvc.devices()" [class.is-offline]="!presenceSvc.onlineDeviceIds().has(d.id)">
      <div class="device-dot" [class.online]="presenceSvc.onlineDeviceIds().has(d.id)" [class.pulse]="presenceSvc.onlineDeviceIds().has(d.id)" [class.offline]="!presenceSvc.onlineDeviceIds().has(d.id)"></div>
      <div class="device-info">
        <ng-container *ngIf="editingDeviceId !== d.id; else editMode">
          <div class="device-name-container">
            <div class="device-name">{{ d.device_name }}</div>
            <button class="edit-btn" title="Rename device" (click)="startEditDevice(d)">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
            </button>
            <button class="edit-btn danger-hover" title="Delete & Logout Device" (click)="deleteDevice(d)" [disabled]="d.id === devicesSvc.currentDeviceId">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
          </div>
        </ng-container>
        <ng-template #editMode>
          <input class="device-edit-input" 
                 [value]="editDeviceName" 
                 (input)="editDeviceName = $any($event).target.value"
                 (keyup.enter)="saveEditDevice(d)" 
                 (keyup.escape)="cancelEditDevice()" 
                 (blur)="saveEditDevice(d)" 
                 autoFocus />
        </ng-template>
        <div class="device-status">{{ presenceSvc.onlineDeviceIds().has(d.id) ? 'Online' : 'Offline' }}</div>
      </div>
    </div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="nav-section-header clickable" (click)="reviewCollapsed.set(!reviewCollapsed())">
    <div class="nav-section-label">Review</div>
    <svg class="chevron" [class.rotated]="reviewCollapsed()" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
  </div>
  <nav class="filters nav-section-content" *ngIf="!reviewCollapsed()">
    <button class="filter-item" (click)="openDigest.emit()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
      <span class="label">Weekly Digest</span>
    </button>
  </nav>

  <div class="divider"></div>

  <div class="nav-section-header">
    <div class="nav-section-label">Vault</div>
  </div>
  <nav class="filters nav-section-content">
    <button class="filter-item" [class.active]="activeView === 'feed' && itemsSvc.filter() === 'archived'" (click)="setFilter('archived')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="21 8 21 21 3 21 3 8"></polyline><rect x="1" y="3" width="22" height="5"></rect><line x1="10" y1="12" x2="14" y2="12"></line></svg>
      <span class="label">Archive</span>
    </button>
    <button class="filter-item" [class.active]="activeView === 'feed' && itemsSvc.filter() === 'deleted'" (click)="setFilter('deleted')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
      <span class="label">Recently Deleted</span>
    </button>
  </nav>
  </div>

  <div class="sidebar-footer">
    <button class="export-btn" (click)="itemsSvc.exportData()" title="Export all items as JSON">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" />
      </svg>
      Export Data
    </button>
    <div class="footer-bottom">
      <span class="email" [title]="auth.session()?.user?.email">{{ auth.session()?.user?.email }}</span>
      <button class="signout-btn" (click)="auth.signOut()" title="Sign out">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
    </div>
  </div>
</aside>

<!-- Create Board Modal -->
<div class="modal-overlay" *ngIf="showCreateBoardModal" (click)="closeCreateBoard()">
  <div class="modal-content custom-modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Create New Board</h2>
      <button class="close-btn" (click)="closeCreateBoard()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <p class="modal-desc">Create a collaborative board to share links and media.</p>
      <input 
        type="text" 
        class="custom-input" 
        placeholder="Board name" 
        [value]="newBoardName"
        (input)="newBoardName = $any($event).target.value"
        (keyup.enter)="confirmCreateBoard()"
        (keyup.escape)="closeCreateBoard()"
        autofocus
      />
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" (click)="closeCreateBoard()">Cancel</button>
      <button class="btn-primary" (click)="confirmCreateBoard()" [disabled]="!newBoardName.trim()">Create Board</button>
    </div>
  </div>
</div>

<app-manage-members-modal 
  *ngIf="showManageMembersModal && activeManageBoardId" 
  [boardId]="activeManageBoardId" 
  (close)="closeManageMembers()">
</app-manage-members-modal>

<!-- Global Share Dropdown -->
<div class="share-dropdown-menu" 
     *ngIf="openShareDropdownBoard() && shareDropdownPos()" 
     [style.position]="'fixed'"
     [style.top.px]="shareDropdownPos()!.y"
     [style.left.px]="shareDropdownPos()!.x"
     [style.transform]="'translateX(-100%)'"
     (click)="$event.stopPropagation()">
  <button class="share-dropdown-item" (click)="boardsSvc.copyInviteLink(openShareDropdownBoard(), 'editor'); closeShareDropdown()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
    Copy Editor Link
  </button>
  <button class="share-dropdown-item" (click)="boardsSvc.copyInviteLink(openShareDropdownBoard(), 'viewer'); closeShareDropdown()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
    Copy Viewer Link
  </button>
</div>
