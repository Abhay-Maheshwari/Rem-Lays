<div class="minimal-home-container" [style.background]="currentBg.style">
  <div class="content-wrapper">
    
    <header class="hero-header">
      <h1 class="greeting">Welcome back, <span class="accent-name">{{ userName }}</span></h1>
      <div class="subtitle">
        Your digital vault is ready.
        <span *ngIf="unreadItems > 0"> You have <span class="highlight-text">{{ unreadItems }}</span> pending items.</span>
      </div>
    </header>

    <div class="grid-section">
      <div class="action-grid">
        <button class="flat-card" (click)="goTo('feed')">
          <div class="icon-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
          </div>
          <div class="card-info">
            <span class="card-title">Inbox</span>
            <span class="card-desc">All your saved items</span>
          </div>
        </button>
      </div>
    </div>

    <div class="grid-section">
      <h2 class="section-label">Boards</h2>
      <div class="boards-grid">
        <button class="flat-card board-card" *ngFor="let board of boardsSvc.boards()" (click)="goToBoard(board.id)">
          <div class="icon-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
          </div>
          <div class="card-info">
            <span class="card-title">{{ board.name }}</span>
          </div>
        </button>

        <!-- Create Board Tile -->
        <div class="flat-card board-card create-board-card" [class.editing]="isCreatingBoard" (click)="!isCreatingBoard && startCreateBoard()">
          <ng-container *ngIf="!isCreatingBoard">
            <div class="icon-wrap">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </div>
            <div class="card-info">
              <span class="card-title">New Board</span>
            </div>
          </ng-container>

          <div class="inline-input-wrap" *ngIf="isCreatingBoard" (click)="$event.stopPropagation()">
            <input type="text" class="board-input" placeholder="Board name..." 
                   [value]="newBoardName" (input)="newBoardName = $any($event).target.value"
                   (keyup.enter)="confirmCreateBoard()" (keyup.escape)="cancelCreateBoard()" autofocus>
          </div>
        </div>

      </div>
    </div>

    <div class="grid-section">
      <h2 class="section-label">Schedule & Calendar</h2>
      <app-calendar-widget (navigate)="goTo('calendar')"></app-calendar-widget>
    </div>

  </div>
</div>
