<div class="overlay" (click)="close.emit()">
  <div class="modal" (click)="openDropdownId.set(null); $event.stopPropagation()">
    <div class="modal-header">
      <h3>Board Settings</h3>
      <button class="close-btn" (click)="close.emit()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <div *ngIf="isLoading()" class="loading">Loading members...</div>
      
      <div *ngIf="!isLoading()" class="members-list">
        <div *ngFor="let member of members()" class="member-row">
          <div class="member-info">
            <div class="member-email-container">
              <span class="member-email">{{ member.email }}</span>
              <span *ngIf="member.user_id === currentUserId" class="you-badge">(You)</span>
            </div>
            <div class="member-role-label" *ngIf="!isOwner() || member.role === 'owner'">{{ member.role | titlecase }}</div>
          </div>
          
          <div class="member-actions" *ngIf="isOwner() && member.role !== 'owner'">
            <div class="custom-role-dropdown" (click)="$event.stopPropagation()">
              <button class="role-trigger" (click)="openDropdownId.set(openDropdownId() === member.user_id ? null : member.user_id)">
                <span>{{ member.role | titlecase }}</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
              </button>
              
              <div class="dropdown-menu" *ngIf="openDropdownId() === member.user_id">
                <button class="dropdown-item" [class.active]="member.role === 'editor'" (click)="changeRole(member, 'editor'); openDropdownId.set(null)">Editor</button>
                <button class="dropdown-item" [class.active]="member.role === 'viewer'" (click)="changeRole(member, 'viewer'); openDropdownId.set(null)">Viewer</button>
              </div>
            </div>
            
            <button class="icon-btn remove-btn" title="Remove member" (click)="removeMember(member)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
          </div>
        </div>
      </div>
      
      <!-- Auto Assign Hashtags -->
      <div *ngIf="!isLoading() && isOwner()" class="modal-section" style="margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border-subtle);">
        <h4 style="margin-bottom: 8px; font-size: 14px; color: var(--text-primary); font-weight: 500;">Auto-Assign Hashtags</h4>
        <p style="margin-bottom: 12px; font-size: 13px; color: var(--text-tertiary);">Any item containing these tags will be automatically moved to this board.</p>
        <app-tag-input 
          [tags]="autoAssignTags()" 
          (tagsChange)="updateAutoAssignTags($event)" 
          placeholder="e.g. work, project">
        </app-tag-input>
      </div>
      
      <!-- Danger Actions -->
      <div *ngIf="!isLoading()" class="modal-footer danger-zone" style="margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border-subtle); display: flex; justify-content: flex-end;">
        <button *ngIf="isOwner()" class="btn-danger" (click)="deleteBoard()" style="background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s;">
          Delete Board
        </button>
        <button *ngIf="!isOwner()" class="btn-danger" (click)="leaveBoard()" style="background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s;">
          Leave Board
        </button>
      </div>
    </div>
  </div>
</div>
