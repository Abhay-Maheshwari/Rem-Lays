<div class="collections-container">
  <header class="collections-header">
    <button class="icon-btn header-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    <div class="spacer"></div>
    <button class="icon-btn header-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg></button>
    <button class="icon-btn header-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
  </header>

  <div class="collections-content">
    <h1 class="main-title">Save now.<br>Find anytime.</h1>
    
    <div class="quick-save-bar">
      <span class="hash">#</span>
      <input type="text" placeholder="Paste link to quick save" class="quick-save-input">
      <button class="add-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>

    </div>

    <!-- Notification Banner -->
    <div class="notification-banner" *ngIf="itemsSvc.unseenCount() > 0" (click)="reviewUnseen()">
      <div class="banner-icon-bg">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
      </div>
      <div class="banner-text">
        <div class="banner-title">{{ itemsSvc.unseenCount() }} new links waiting</div>
        <div class="banner-subtitle">Review now</div>
      </div>
      <svg class="banner-action" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </div>

    <h2 class="section-title">My Collections</h2>

    <div class="collections-grid">
      <!-- Uncategorized Folder -->
      <div class="folder-card color-gray" (click)="openTag(null)">
        <div class="folder-tab"></div>
        <div class="folder-body">
          <div class="folder-content">
             <div class="folder-icon-row">
                <div class="folder-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></div>
                <div class="folder-stats">
                  <span class="links-count">{{ untaggedCount() || 0 }} items</span>
                </div>
             </div>
             <div class="folder-name">Unsorted</div>
          </div>
        </div>
      </div>

      <!-- Tag Folders -->
      <div class="folder-card" *ngFor="let tag of globalTags()" [ngStyle]="getFolderStyles(tag)" (click)="openTag(tag)">
        <div class="folder-tab"></div>
        <div class="folder-body">
          <div class="folder-content">
             <div class="folder-icon-row" [class.empty]="!globalTagCounts().get(tag)">
                <div class="folder-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg></div>
                <div class="folder-stats">
                  <span class="links-count">{{ globalTagCounts().get(tag) || 0 }} items</span>
                </div>
             </div>
             <div class="folder-name">{{ tag }}</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
